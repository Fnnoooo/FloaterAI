async function open(){

  const st=d.createElement('style');st.textContent=css;d.head.append(st);
  d.body.innerHTML=`<header><div><b>Learning</b> <small>• floating assistant</small></div><span class="orb"></span></header><div class="tabs"><button id="ai-tab" class="selected">✦ AI</button><button id="games-tab">🎮 Games</button></div><main><div class="games-panel" id="games-panel"><form id="game-search" class="game-search"><input id="game-query" placeholder="Search games by name or URL…"><button>Search</button></form><div id="game-results" class="game-results"></div><div class="game-hint" id="game-hint">Find a game, then select Play. Some games may not support PiP.</div><iframe id="game-view" class="game-view" allow="fullscreen; autoplay; gamepad; pointer-lock" referrerpolicy="no-referrer"></iframe><button id="game-back">← Back to results</button></div><div class="status" id="status">Share a tab to ask questions about it. Screen sharing is optional.</div><div class="controls"><button id="solve" disabled>Solve this page</button><button id="stop" disabled>Stop sharing</button></div><div class="messages" id="messages"><div class="msg">Hi! I can help explain text from a tab you choose to share. Screenshots are captured only when you ask a question.</div></div><form id="ask"><input id="prompt" placeholder="Ask about the shared tab…" autocomplete="off"><button id="send">Ask</button></form></main>`;
  const $=id=>d.getElementById(id),status=t=>$('status').textContent=t,add=(t,who='ai')=>{let el=d.createElement('div');el.className='msg '+who;el.textContent=t;$('messages').append(el);$('messages').scrollTop=$('messages').scrollHeight;return el;};
  const gamePanel=$('games-panel');
  const aiElements=['status','solve','stop','messages','ask'];
  function selectTab(which){const games=which==='games';gamePanel.classList.toggle('visible',games);for(const id of aiElements){const el=$(id);if(el)el.style.display=games?'none':'';}$('ai-tab').classList.toggle('selected',!games);$('games-tab').classList.toggle('selected',games);}
  $('ai-tab').onclick=()=>selectTab('ai');$('games-tab').onclick=()=>selectTab('games');
  let gameResults=[];
  const gameStatus=t=>$('game-hint').textContent=t;
  const gameList=()=>{const el=$('game-results');el.replaceChildren();gameResults.forEach(item=>{const b=d.createElement('button');b.type='button';b.textContent='▶ '+item.title+' — '+new URL(item.url).hostname;b.onclick=()=>playGame(item.url);el.append(b);});};
  async function playGame(url){try{gameStatus('Preparing proxy…');await window.floaterProxyReady();const target=window.floaterProxyUrl(url);$('game-view').src=target;gameStatus('Loading '+new URL(url).hostname+' through Cloudflare Wisp…');}catch(e){gameStatus('Proxy error: '+e.message);}}
  $('game-search').onsubmit=async e=>{e.preventDefault();const q=$('game-query').value.trim();if(!q)return;gameStatus('Searching for '+q+'…');$('game-results').replaceChildren();try{const response=await fetch('/api/game-search?q='+encodeURIComponent(q));if(!response.ok)throw Error('Search HTTP '+response.status);const data=await response.json();gameResults=data.results||[];gameList();gameStatus(gameResults.length?'Choose a result to play. '+(data.note||''):'No results. Try the game website URL instead.');}catch(e){gameStatus('Search unavailable: '+e.message);}};
  $('game-back').onclick=()=>{$('game-view').src='about:blank';gameStatus('Select another game from the results.');};
  const stop=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;video=null;active=false;$('solve').disabled=true;$('stop').disabled=true;status('Not sharing. You can share again at any time.');};
  // Screen sharing is permission-based. The floating PiP window stays visible
  // while the browser focuses the selected tab when supported.
  // The capture request is invoked in the opener's Window context, not the PiP document.
  // This restores the original site's main-document capture/focus path.
  // Chrome only permits a focus request for the selected tab during the
  // short interval immediately after getDisplayMedia resolves.
  // A direct click on the main document has the most reliable activation.
  const startShare=async()=>{
    try{
      status('Choose a Chrome Tab in the sharing dialog…');

  };
  // PiP-triggered screen capture remains available, but the main-page button
  // offers a genuine direct user click in the top-level browsing context.

  const mainShare=document.getElementById('share-from-page');
  if(mainShare){
    mainShare.textContent='✦ Share Chrome Tab';
    mainShare.onclick=launchShare;
  }
  $('stop').onclick=stop;
  const currentPip=pip;

   if(pip!==currentPip)return;
   stop();pip=null;window.__floaterAcceptStream=null;
   const b=document.getElementById('share-from-page');
   if(b){b.disabled=false;b.innerHTML='<span>✦ Share Chrome Tab</span>';b.onclick=launchShare;}
   const tip=document.getElementById('launch-tip');

  },{once:true});
  $('solve').onclick=()=>{if(!active)return;$('prompt').value='Solve the problem(s) visible on the shared page. Show the steps and explain the answers. If the text is unclear, say what is missing.';$('ask').requestSubmit();};
  $('ask').onsubmit=async(e)=>{e.preventDefault();const question=$('prompt').value.trim();if(!question)return;$('prompt').value='';add(question,'user');$('send').disabled=true;const bubble=add('Thinking…');try{

    const result=await window.Tesseract.recognize(canvas.toDataURL('image/png'),'eng');extracted=String(result.data?.text||'').slice(0,4500);
   }

   const aiPrompt=needsScreen?prompt.slice(0,6000):question.slice(0,4000);
   const extract=o=>{if(typeof o==='string')return o;const v=o?.response??o?.answer??o?.result??o?.message??o?.data?.response??o?.data?.answer??o?.data?.result??o?.data?.reply??o?.data?.content??o?.data?.text??o?.data?.message??o?.text??o?.output??o?.choices?.[0]?.message?.content;return typeof v==='string'?v:(v?.text||v?.content||v?.message||'');};
   async function requestAI(endpoint,field,model){
    const url=new URL(endpoint);url.searchParams.set(field,aiPrompt);if(model)url.searchParams.set('model',model);
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
    try{const resp=await fetch(url,{signal:controller.signal});if(!resp.ok)throw Error('HTTP '+resp.status);const raw=await resp.text();let data;try{data=JSON.parse(raw)}catch{data=raw}const reply=extract(data);const answer=typeof reply==='string'?reply.trim():'';if(!answer)throw Error('AI returned no answer');if(/technical difficulties|please try again in a moment|service unavailable/i.test(answer))throw Error('AI service temporarily unavailable');return answer;}finally{clearTimeout(timer)}
   }
   let answer;try{answer=await requestAI('https://prexzyapis.com/ai/aiapk','prompt');}catch(primaryError){status('Trying backup AI…');try{answer=await requestAI('https://prexzyapis.com/ai/gemini','prompt');}catch(backupError){throw Error('AiApk: '+primaryError.message+'; Gemini backup: '+backupError.message)}}
   bubble.textContent=answer;status(active?'Sharing active — ready for another question.':'Ready. Share a tab for screen-based questions.');
  }catch(err){bubble.textContent='Unable to answer: '+err.message;status('AI connection failed. The shared-tab capture can still work.');}finally{$('send').disabled=false;}};

function install(){const workspace=document.getElementById('nexus-ai-chat-workspace');if(!workspace||document.getElementById('nx-learning-launch'))return;const b=document.createElement('button');b.id='nx-learning-launch';b.type='button';b.textContent='✧ Open Floating Learning Assistant';b.onclick=open;workspace.insertBefore(b,workspace.firstChild);
 const back=document.createElement('button');back.id='nx-learning-back';back.type='button';back.textContent='← Go Back';back.onclick=()=>{if(typeof window.switchTab==='function')window.switchTab('home');else document.getElementById('nav-home')?.click();};
 workspace.insertBefore(back,b);

const captureFromMainPage=async()=>{
 const options={video:{displaySurface:'browser'},audio:false,preferCurrentTab:false,selfBrowserSurface:'exclude'};
 let controller=null;
 if(typeof window.CaptureController==='function'){
  try{controller=new window.CaptureController();options.controller=controller;}catch(e){console.warn(e);}
 }
 const selectedStream=await window.navigator.mediaDevices.getDisplayMedia(options);
 // IMPORTANT: call focus immediately in the getDisplayMedia resolution continuation.
 // Waiting for the PiP promise closes the narrow browser focus-decision window.
 if(controller&&typeof controller.setFocusBehavior==='function'){
  try{controller.setFocusBehavior('focus-captured-surface');}catch(e){console.warn('Tab focus denied:',e);}
 }
 return {stream:selectedStream};
};
async function launchShare(){
 const b=document.getElementById('share-from-page');
 if(!b||b.disabled)return;
 b.disabled=true;
 const tip=document.getElementById('launch-tip');
 let captured=null;
 try{
  // One browser permission request at a time. Request capture directly
  // from the main page's click, preserving V14's working tab-focus timing.
  tip.textContent='Choose the Chrome tab to share…';
  const result=await captureFromMainPage();
  captured=result.stream;
  // Only request Document PiP AFTER Chrome has completed the share picker.
  // Concurrent getDisplayMedia + requestWindow can reject one permission
  // with NotAllowedError even when the user did not click Deny.
  if(!pip||pip.closed){
   tip.textContent='Opening floating AI…';
   await open();
  }
  if(!pip||pip.closed)throw Error('Chrome did not open the floating window. Click again to retry.');
  if(typeof window.__floaterAcceptStream!=='function')throw Error('Floating window not ready.');
  await window.__floaterAcceptStream(captured);
  captured=null;
  tip.textContent='Sharing active. Close the window and click here to share again.';
 }catch(e){
  captured?.getTracks().forEach(t=>t.stop());
  const name=e?.name||'';
  if(name==='NotAllowedError'){
   tip.textContent='Chrome blocked or dismissed the sharing request. No permission is stored. Click here to try again.';
  }else{
   tip.textContent='Could not start: '+(e?.message||String(e))+'. Click to retry.';
  }
 }finally{
  b.disabled=false;
  b.onclick=launchShare;
 }
}

 document.body.innerHTML='<div class="calc"><div class="screen" id="calc-screen">0</div><div class="keys" id="calc-keys"></div><div class="hint">Calculator</div></div>';
