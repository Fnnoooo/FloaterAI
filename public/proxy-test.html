<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floater Proxy Standalone Test</title><script src="/scram/scramjet.all.js"></script><script src="/baremux/index.js"></script><script src="/register-sw.js"></script><script src="/games-proxy.js"></script><style>body{font:15px system-ui;background:#10111b;color:#eee;margin:20px}input{width:min(500px,70%);padding:10px}button{padding:10px}iframe{width:100%;height:55vh;background:white;border:2px solid #555;margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e2030;padding:12px}a{color:#a9b9ff}</style></head><body><h2>Standalone Scramjet / Wisp Test</h2><p>This is a separate diagnostic page, not the Picture-in-Picture window.</p><input id="url" value="https://example.com" aria-label="Website URL"><button id="go">Test proxy</button><p id="status">Ready</p><pre id="log"></pre><iframe id="frame" title="Proxied website"></iframe><script>
const log=(...a)=>{document.querySelector('#log').textContent+=a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ')+'\n'};
const status=s=>document.querySelector('#status').textContent=s;
window.addEventListener('error',e=>log('Page error:',e.message));window.addEventListener('unhandledrejection',e=>log('Unhandled rejection:',String(e.reason)));
document.querySelector('#go').onclick=async()=>{document.querySelector('#log').textContent='';status('Initializing...');try{await window.floaterProxyReady();const connection=new BareMux.BareMuxConnection('/baremux/worker.js');log('Transport:',await connection.getTransport());const regs=await navigator.serviceWorker.getRegistrations();log('Service workers:',regs.map(r=>({scope:r.scope,active:r.active?.state})));log('Controller active:',!!navigator.serviceWorker.controller);const url=document.querySelector('#url').value.trim();const target=/^https?:\/\//i.test(url)?url:'https://'+url;const encoded=window.floaterProxyUrl(target);log('Target:',target);log('Encoded URL:',encoded);const frame=document.querySelector('#frame');frame.onload=()=>{log('Iframe load event (not proof of successful website load)');status('Iframe load event fired — inspect content / network')};frame.onerror=()=>{log('Iframe error event');status('Iframe error')};frame.src=encoded;status('Navigating iframe...');setTimeout(()=>{if(status && document.querySelector('#status').textContent==='Navigating iframe...'){status('Still loading after 15 seconds');log('Request appears stalled; inspect Network and service worker console.')}},15000)}catch(e){status('Initialization failed');log(e.stack||String(e))}};
</script></body></html>
