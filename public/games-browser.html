<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games Proxy</title><script src="/scram/scramjet.all.js"></script><script src="/baremux/index.js"></script><script src="/register-sw.js"></script><script src="/games-proxy.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#090a10;color:#eee9ff;font:15px system-ui}header{padding:18px 22px;background:#171222;border-bottom:1px solid #57447a}h1{margin:0;font-size:23px}main{padding:18px;max-width:1100px;margin:auto}form{display:flex;gap:9px}input{flex:1;min-width:0;background:#191426;color:white;border:1px solid #8060b3;border-radius:10px;padding:13px}button{background:#55378a;color:white;border:1px solid #9872d2;border-radius:10px;padding:11px 16px;cursor:pointer}#results{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#status{color:#c4b2df;font-size:13px;min-height:22px}#viewer{display:block;width:100%;height:calc(100vh - 225px);min-height:320px;border:1px solid #584477;border-radius:12px;background:#fff}</style></head><body><header><h1>🎮 Games Proxy</h1></header><main><form id="search"><input id="q" placeholder="Search a game name or enter a website URL" aria-label="Search games" required><button>Search</button></form><p id="status">Search for a game or enter its URL.</p><div id="results"></div><iframe id="viewer" title="Proxied game" allow="fullscreen;autoplay;gamepad;pointer-lock"></iframe></main><script>const q=document.getElementById('q'),status=document.getElementById('status'),results=document.getElementById('results'),viewer=document.getElementById('viewer');async function play(url){try{status.textContent='Connecting to proxy…';await window.floaterProxyReady();viewer.src=window.floaterProxyUrl(url);status.textContent='Loading '+new URL(url).hostname+' through proxy…';}catch(e){status.textContent='Proxy failed: '+e.message}}document.getElementById('search').addEventListener('submit',async e=>{e.preventDefault();const term=q.value.trim();if(!term)return;results.replaceChildren();if(/^https?:\/\//i.test(term)){play(term);return}status.textContent='Searching…';try{const response=await fetch('/api/game-search?q='+encodeURIComponent(term));if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();for(const item of data.results||[]){const b=document.createElement('button');b.textContent='▶ '+item.title;b.onclick=()=>play(item.url);results.append(b)}status.textContent=results.children.length?'Choose a game to play.':'No results. Try a direct game URL.';}catch(err){status.textContent='Search unavailable: '+err.message}});</script></body></html>
